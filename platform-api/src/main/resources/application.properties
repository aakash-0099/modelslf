spring.application.name=user-management-service

# Server
server.port=${SERVER_PORT:8081}


# =========================================================
# PostgreSQL Configuration
# =========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin@123}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# Spring DevTools
# =========================================================
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true


# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET:local-development-secret-key-change-me-2026}
jwt.expiration=${JWT_EXPIRATION:3600000}


# =========================================================
# Logging
# =========================================================
logging.level.org.springframework.web=DEBUG


# =========================================================
# Rate Limiting
# =========================================================
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.capacity=${RATE_LIMIT_CAPACITY:100}
rate-limit.refill-tokens=${RATE_LIMIT_REFILL_TOKENS:100}
rate-limit.refill-duration-seconds=${RATE_LIMIT_REFILL_DURATION_SECONDS:60}


# =========================================================
# Redis
# =========================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:500ms}


# =========================================================
# Actuator
# =========================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true