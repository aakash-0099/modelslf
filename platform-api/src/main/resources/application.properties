spring.application.name=platform-api

# Server
server.port=${SERVER_PORT:8081}


# =========================================================
# PostgreSQL Configuration
# =========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin@123}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# Spring DevTools
# =========================================================
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true


# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET:local-development-secret-key-change-me-2026}
jwt.expiration=${JWT_EXPIRATION:3600000}


# =========================================================
# Logging
# =========================================================
logging.level.org.springframework.web=DEBUG


# =========================================================
# Actuator
# =========================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true